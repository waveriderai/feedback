name: Notify feedback submitter

on:
  issue_comment:
    types: [created]

jobs:
  notify:
    # Only notify when repo members/owners comment (not external users)
    if: >
      github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR'
    runs-on: ubuntu-latest
    steps:
      - name: Extract email and send notification
        uses: actions/github-script@v7
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          script: |
            const issueBody = context.payload.issue.body || '';
            const emailMatch = issueBody.match(/\*\*User\*\*\s*\|\s*([^\s|]+@[^\s|]+)/);

            if (!emailMatch) {
              console.log('No email found in issue body, skipping');
              return;
            }

            const email = emailMatch[1].trim();
            const issueTitle = context.payload.issue.title;
            const commentBody = context.payload.comment.body;
            const commentUrl = context.payload.comment.html_url;
            const commenter = context.payload.comment.user.login;

            const html = `
            <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto;">
              <div style="background: #0a0e27; padding: 20px; border-radius: 8px 8px 0 0;">
                <h2 style="color: #60a5fa; margin: 0;">WaveRider Feedback</h2>
              </div>
              <div style="padding: 20px; background: #1a1a2e; color: #e0e0e0; border-radius: 0 0 8px 8px;">
                <p style="color: #9ca3af; margin-top: 0;">We responded to your feedback:</p>
                <h3 style="color: #f0f0f0;">${issueTitle}</h3>
                <div style="background: #0d1117; border-left: 3px solid #60a5fa; padding: 12px 16px; border-radius: 4px; margin: 16px 0;">
                  <p style="color: #c9d1d9; white-space: pre-wrap; margin: 0;">${commentBody.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</p>
                </div>
                <p style="color: #9ca3af; font-size: 13px;">— ${commenter} from WaveRider</p>
                <a href="${commentUrl}" style="display: inline-block; background: #2563eb; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; margin-top: 12px;">View on GitHub</a>
                <hr style="border: none; border-top: 1px solid #333; margin: 20px 0;">
                <p style="color: #6b7280; font-size: 12px;">You received this because you submitted feedback on WaveRider.ai. You can reply directly on the GitHub issue linked above.</p>
              </div>
            </div>`;

            const res = await fetch('https://api.resend.com/emails', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.RESEND_API_KEY}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                from: 'WaveRider Feedback <feedback@waverider.ai>',
                to: email,
                subject: `Re: ${issueTitle}`,
                html: html,
              }),
            });

            const result = await res.json();
            if (res.ok) {
              console.log(`Notification sent to ${email}`, result);
            } else {
              console.error(`Failed to send to ${email}:`, result);
              core.setFailed(`Email send failed: ${JSON.stringify(result)}`);
            }
